version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      actions-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
    commit-message:
      prefix: ci
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Majors are split from minors and patches so a jump that needs its release notes
    # read never rides along with routine patches.
    groups:
      gradle:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      gradle-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
    ignore:
      # The compile target is a compatibility decision, not a security one: paper-api
      # decides the OLDEST server this plugin runs on, and `api-version: '1.21'` in
      # plugin.yml has to move in the same commit. A bot raising it narrows the
      # supported range silently and nothing fails to tell us.
      - dependency-name: io.papermc.paper:paper-api
      # Adventure is compileOnly here because PAPER SHIPS IT -- these coordinates are
      # compiled against and then provided by the server at runtime. So the version
      # declared here must not exceed what the target Paper bundles, or the plugin
      # compiles, enables, and dies on the first message with NoSuchMethodError. Only
      # `Folia Boot Smoke Test` would catch that, and only if the path it breaks on is
      # one the smoke test walks.
      #
      # Matched by prefix rather than by artifact so the guard survives a serializer
      # being added later. ALL THREE semver types are listed, not just major: the
      # ceiling is whatever Paper bundles, Adventure adds API in MINOR releases, and a
      # major-only ignore therefore guards nothing that matters. Pull request 106 was a
      # minor - 4.18.0 -> 4.26.1 - and walked straight through exactly that.
      #
      # Listing update-types rather than naming the dependency alone is deliberate and
      # is the difference between two behaviours GitHub documents: an ignore carrying
      # `update-types` filters VERSION updates only, and "security updates will always
      # be created regardless"; an ignore naming the dependency with no qualifier
      # suppresses security updates too. Blanket-ignoring would silently give up every
      # future CVE-driven pull request for these coordinates, which is not a trade this
      # repository needs to make. A security bump may still land above Paper's ceiling -
      # that is a decision for whoever reads it, and being told beats not being told.
      #
      # SessionPulse scopes its identical wildcard to majors and is right to, for a
      # reason that does NOT hold here: it SHADES and relocates net.kyori into its own
      # jar, so it owns Adventure at runtime and minors cannot break it. This plugin
      # shades nothing and takes Adventure from the server. Do not copy that scoping
      # back here without first checking which side of that line the build sits on.
      - dependency-name: "net.kyori:*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      # Test scope only, and pinned to match what paper-api resolves. paper-api is on the
      # test classpath too, so raising this literal moves BOTH sides of
      # ConfigSectionConformanceTest: it would compare 2.7 against 2.7, keep passing, and
      # stop saying anything about the parser the server actually runs.
      #
      # Same update-types construction as above, and for the same reason: this blocks the
      # routine bump that quietly desynchronises the test from production, while leaving
      # a snakeyaml advisory free to raise a pull request. That matters here even though
      # nothing ships this jar - the exposure is the CI test classpath, which is ours
      # rather than Paper's.
      - dependency-name: org.yaml:snakeyaml
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    commit-message:
      # `build` rather than `ci`: ci is the Conventional Commits type for workflow
      # actions, build is the one for build-system dependencies.
      prefix: build
    labels:
      - dependencies
    # The Gradle wrapper version is not covered by package-ecosystem: gradle. It stays a
    # manual bump.
    open-pull-requests-limit: 5
