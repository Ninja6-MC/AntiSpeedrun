version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      actions-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
    commit-message:
      prefix: ci
    labels:
      - dependencies
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Majors are split from minors and patches so a jump that needs its release notes
    # read never rides along with routine patches.
    groups:
      gradle:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      gradle-major:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - major
    ignore:
      # The compile target is a compatibility decision, not a security one: paper-api
      # decides the OLDEST server this plugin runs on, and `api-version: '1.21'` in
      # plugin.yml has to move in the same commit. A bot raising it narrows the
      # supported range silently and nothing fails to tell us.
      - dependency-name: io.papermc.paper:paper-api
      # Adventure is compileOnly here because PAPER SHIPS IT -- these coordinates are
      # compiled against and then provided by the server at runtime. So the version
      # declared here must not exceed what the target Paper bundles, or the plugin
      # compiles, enables, and dies on the first message with NoSuchMethodError. Only
      # `Folia Boot Smoke Test` would catch that, and only if the path it breaks on is
      # one the smoke test walks.
      #
      # Matched by prefix rather than by artifact so the guard survives a serializer
      # being added later, and NOT restricted by update-type. The ceiling here is
      # whatever Paper bundles, and Adventure adds API in MINOR releases - so a
      # major-only guard does not guard the thing described above. Pull request 106 was
      # a minor, 4.18.0 -> 4.26.1, and walked straight through a major-only ignore.
      #
      # SessionPulse scopes its identical wildcard to majors, and that is correct THERE
      # for a different reason: its messages go through BukkitAudiences, adventure-
      # platform stops at 4.4.1, and the break it guards is an adventure 5.x. This
      # plugin has no adventure-platform at all, so do not copy that scoping back here.
      #
      # COST, recorded rather than discovered later: an ignore suppresses Dependabot
      # SECURITY updates as well as version updates. No CVE-driven bump will be raised
      # for these coordinates again. That is accepted because the classes come from the
      # server jar at runtime - a fix has to arrive as a Paper upgrade, and raising the
      # literal here would not deliver it. The one case this is wrong for is a net.kyori
      # dependency the plugin SHADES into its own jar, which it would then own at
      # runtime - none exists today, and adding one means revisiting this line.
      - dependency-name: "net.kyori:*"
      # Test scope only, and pinned to match what paper-api resolves. paper-api is on the
      # test classpath too, so raising this literal moves BOTH sides of
      # ConfigSectionConformanceTest: it would compare 2.7 against 2.7, keep passing, and
      # stop saying anything about the parser the server actually runs.
      #
      # The exposure this ignore accepts is narrower than the one above but it is NOT
      # zero and it is not Paper's: a snakeyaml advisory would go unproposed on the CI
      # test classpath. Nothing ships it, so the trade is accepted.
      - dependency-name: org.yaml:snakeyaml
    commit-message:
      # `build` rather than `ci`: ci is the Conventional Commits type for workflow
      # actions, build is the one for build-system dependencies.
      prefix: build
    labels:
      - dependencies
    # The Gradle wrapper version is not covered by package-ecosystem: gradle. It stays a
    # manual bump.
    open-pull-requests-limit: 5
