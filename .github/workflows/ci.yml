name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    # Both jobs together normally finish in about 3.5 minutes, so 15 is roughly four times
    # the observed norm -- generous against a cold cache or a slow runner, and short enough
    # that a wedge turns red inside one review cycle. Without it a job inherits GitHub's
    # 360-minute default, where a queued run, a slow run and a hung one are indistinguishable
    # for six hours. `Build and Test` is a required check, so that is six hours of a gate
    # neither passing nor failing. agent-review-gate.yml already sets timeout-minutes: 5.
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Dependabot does not honor .gitattributes when it rewrites the wrapper, so a bump can
      # commit gradlew.bat as a CRLF blob after it was normalized to LF (#131, #136). The
      # index side of `git ls-files --eol` is what was committed; a text-attributed file must
      # be LF there whatever the working tree looks like.
      - name: Reject CRLF In Text-Attributed Files
        run: |
          bad=$(git ls-files --eol | awk '($1 == "i/crlf" || $1 == "i/mixed") && $3 ~ /^attr\/text/ { print }' | cut -f2-)
          if [ -n "$bad" ]; then
            echo "$bad" | while IFS= read -r f; do echo "::error file=$f::CR bytes in the index for a text-attributed file."; done
            echo "::error::Fix with: git add --renormalize <file>, then commit."
            exit 1
          fi
          echo "No text-attributed file has CRLF in the index."

      - name: Validate Gradle Wrapper
        id: wrapper
        continue-on-error: true
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Wait Before Revalidating
        if: steps.wrapper.outcome == 'failure'
        run: sleep 15

      - name: Validate Gradle Wrapper (retry)
        if: steps.wrapper.outcome == 'failure'
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Ensure Gradle Wrapper Is Executable
        run: chmod +x ./gradlew

      # Folia has no BukkitScheduler: Bukkit.getScheduler() throws
      # UnsupportedOperationException at runtime, and BukkitRunnable is unusable.
      # All scheduling must go through RegionScheduler, EntityScheduler, or
      # AsyncScheduler. This is the default idiom in most Paper tutorials, so it
      # gets caught here rather than on a production Folia server.
      # Matches both routes to the illegal scheduler (Bukkit.getScheduler() and
      # getServer().getScheduler()), BukkitRunnable, and the runTask*/schedule*
      # method families. Deliberately does NOT match entity.getScheduler() or
      # Bukkit.getRegionScheduler()/getAsyncScheduler()/getGlobalRegionScheduler(),
      # which are the legal Folia replacements.
      - name: Reject Bukkit Scheduler Usage
        run: |
          # Actions runs this as `bash -e`, so grep's exit 1 on a clean tree would
          # terminate the step before the status check. `|| status=$?` suppresses
          # errexit for this one command while still capturing the code.
          status=0
          grep -rnE '(\bBukkit\s*\.\s*getScheduler\s*\()|(getServer\s*\(\)\s*\.\s*getScheduler\s*\()|(\bBukkitRunnable\b)|(\.\s*runTask\w*\s*\()|(\bschedule(Sync|Async)\w*\s*\()' src/main/java || status=$?
          # 0 = match found (a violation), 1 = clean, anything else = grep itself failed
          # (missing directory, bad pattern) and must not be mistaken for a pass.
          if [ $status -eq 0 ]; then
            echo "::error::Bukkit scheduler API is not available on Folia. Use RegionScheduler, EntityScheduler, or AsyncScheduler."
            exit 1
          elif [ $status -ne 1 ]; then
            echo "::error::Scheduler guard could not run (grep exit $status)."
            exit 1
          fi
          echo "No Bukkit scheduler usage found."

      - name: Verify Folia Manifest Declaration
        run: |
          if ! grep -qE '^folia-supported:[[:space:]]*true' src/main/resources/plugin.yml; then
            echo "::error::plugin.yml must declare 'folia-supported: true' or Folia will refuse to enable the plugin."
            exit 1
          fi
          echo "folia-supported: true is declared."

      - name: Test Snapshot Version and Artifact Checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      # N6-CI-09: a snapshot names the commit CI built. The checkout above is that commit,
      # which on a pull request is the synthetic merge commit, and fetch-depth: 0 brings the
      # history and tags the selector needs to find the nearest reachable release tag.
      - name: Determine Snapshot Version
        id: version
        run: |
          VERSION="$(python3 scripts/snapshot-version.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Snapshot version: $VERSION"

      - name: Run Tests
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew test -PpluginVersion="$PLUGIN_VERSION" --no-daemon

      - name: Build JAR
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build -PpluginVersion="$PLUGIN_VERSION" --no-daemon

      # Testing the selector alone does not prove the build carried the value through. This
      # checks that build/libs holds exactly AntiSpeedrun-<version>.jar and that its embedded
      # plugin.yml says the same version, before anything is uploaded.
      - name: Verify Snapshot Artifact
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/verify-snapshot-artifact.py "$PLUGIN_VERSION"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AntiSpeedrun-SNAPSHOT
          path: build/libs/AntiSpeedrun-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
          retention-days: 7

  server-smoke:
    name: Server Boot (${{ matrix.platform }} ${{ matrix.minecraft }})
    runs-on: ubuntu-latest
    needs: build
    # Same reasoning as `build`. Each leg downloads one server jar and boots it once, so the
    # same headroom is ample; the boot step below carries its own tighter bound.
    timeout-minutes: 15

    # The supported range stated in README.md, booted at both ends and at the last 1.21 release:
    # 1.21.4 is the Paper API the plugin compiles against, so nothing older is claimed, and 26.2
    # is the newest version with a pinned build here. Every leg is pinned to a build number and
    # its SHA-256, so an upstream release never changes what this gate runs. Newer servers are
    # compat.yml's job, on a schedule, where a new upstream release cannot block a pull request.
    # Moving a pin, or extending the range, is a reviewed change to this list and to README.md.
    #
    # Folia 1.21.4 and 26.2 have never published a STABLE build, so their pins are the newest
    # ALPHA and BETA builds respectively. Minecraft 26.1 and newer refuse to start below Java 25;
    # the plugin itself is Java 21 bytecode either way.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: paper, minecraft: '1.21.4', build: 232, java: '21', sha256: 5ee4f542f628a14c644410b08c94ea42e772ef4d29fe92973636b6813d4eaffc }
          - { platform: folia, minecraft: '1.21.4', build: 6, java: '21', sha256: dcf2333211c1468c8eddc482bc8549600818cc661a709124a79c752f8fa2ac3a }
          - { platform: paper, minecraft: '1.21.11', build: 132, java: '21', sha256: 5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba }
          - { platform: folia, minecraft: '1.21.11', build: 14, java: '21', sha256: f52c408490a0225611e67907a3ca19f7e6da2c6bc899e715d5f46844e7103c39 }
          - { platform: paper, minecraft: '26.2', build: 129, java: '25', sha256: b1d8f6bfa1b6101fa8e947b53041cb3bdf5540e7b83b6547ca19ba7edefeb083 }
          - { platform: folia, minecraft: '26.2', build: 7, java: '25', sha256: 128a634192261cd38bb4a5dc54075018a0f896fd6c6f529e37dca6e99e32b3b3 }

    steps:
      # Only for scripts/: the plugin under test is the jar `build` produced, not a rebuild.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'

      - name: Download Built JAR
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v5.0.0
        with:
          name: AntiSpeedrun-SNAPSHOT
          path: dist

      # PaperMC's v2 API is sunset (HTTP 410); the v3 Fill API serves builds with their
      # download URL and checksum. The pinned SHA-256 has to match both what the API publishes
      # for the build and the bytes downloaded.
      - name: Download ${{ matrix.platform }} ${{ matrix.minecraft }}
        env:
          PLATFORM: ${{ matrix.platform }}
          MINECRAFT: ${{ matrix.minecraft }}
          BUILD: ${{ matrix.build }}
          SHA256: ${{ matrix.sha256 }}
        run: >-
          python3 scripts/fetch-server.py --project "$PLATFORM" --version "$MINECRAFT"
          --build "$BUILD" --sha256 "$SHA256" --out server.jar

      # The step that actually waits on a server, and the one #86 watched sit for 25 minutes.
      # boot-smoke.py stops the server once it logs "Done", gives it 240 s to get there and 60 s
      # to obey "stop", and kills it after that; this caps the step as a whole, so a wedge
      # somewhere the script does not cover still fails in minutes. What the log must and must
      # not contain is listed, with the reasons, at the top of scripts/boot-smoke.py.
      - name: Boot Server and Assert Plugin Starts
        timeout-minutes: 8
        env:
          PLUGIN_JAR: dist/AntiSpeedrun-${{ needs.build.outputs.version }}.jar
          LABEL: ${{ matrix.platform }} ${{ matrix.minecraft }} build ${{ matrix.build }}
        run: >-
          python3 scripts/boot-smoke.py --server-jar server.jar --plugin-jar "$PLUGIN_JAR"
          --workdir run --label "$LABEL"

      - name: Upload Server Log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-log-${{ matrix.platform }}-${{ matrix.minecraft }}
          path: run/server.log
          retention-days: 7
          if-no-files-found: warn
