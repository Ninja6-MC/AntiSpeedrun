name: Publish Release
run-name: Publish ${{ inputs.tag }} ${{ inputs.nonce }}

# N6-REL-03 and N6-REL-05: promote a candidate that release-candidate.yml built, booted and
# retained. Start it by hand on the release tag, never on a branch: every job requires
# github.ref to be that tag. `plan` needs no approval and no publishing credential, so its
# failures appear before anyone is asked to approve. Each destination then publishes in its
# own job; all of them wait on the protected `release` environment together, so one approval
# covers the run, and a failure in one does not stop the others. The exception: while another
# tag's GitHub job holds release-shared-state, this run's GitHub job is approved separately
# once it gets the group. RELEASE_PROCESS.md section 3 describes the inputs, the absence
# attestations and how to retry one destination.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, the same ref this workflow runs on (vX.Y.Z[-alpha.N|-beta.N|-rc.N])
        required: true
        type: string
      candidate_run_id:
        description: Run ID of the successful Release Candidate run for this tag
        required: true
        type: string
      destinations:
        description: Destinations to publish in this run, `all` or comma-separated (github,modrinth,hangar)
        required: true
        default: all
        type: string
      modrinth_absence_confirmed:
        description: I inspected the Modrinth owner inventory for this exact version just now, and it is absent in every state
        required: false
        default: false
        type: boolean
      hangar_absence_confirmed:
        description: I inspected the Hangar owner inventory for this exact version just now, and it is absent in every state
        required: false
        default: false
        type: boolean
      nonce:
        description: Free text added to the run name so a script can find this run
        required: false
        default: ''
        type: string

# Evaluated when the run is queued, before any step can validate the inputs, so the group is
# keyed on the ref the run is on rather than on the tag input. Every workflow able to write a
# release version must share it; today this is the only one.
# publish-github also joins the repository-wide release-shared-state group (see that job).
concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}
  CANDIDATE_RUN: ${{ inputs.candidate_run_id }}

jobs:
  plan:
    name: Plan Publication
    if: github.ref == format('refs/tags/{0}', inputs.tag) && startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No environment and no publishing secret. actions: read is for the candidate run, its
    # artifacts and the other publisher runs.
    permissions:
      actions: read
      contents: read
    outputs:
      attempt: ${{ steps.candidate.outputs.attempt }}
      github: ${{ steps.select.outputs.github }}
      modrinth: ${{ steps.select.outputs.modrinth }}
      hangar: ${{ steps.select.outputs.hangar }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Tag and Destinations
        id: select
        env:
          DESTINATIONS: ${{ inputs.destinations }}
          MODRINTH_ATTESTED: ${{ inputs.modrinth_absence_confirmed }}
          HANGAR_ATTESTED: ${{ inputs.hangar_absence_confirmed }}
        run: |
          set -euo pipefail
          python3 scripts/release-candidate.py tag --tag "$TAG" > /dev/null
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/release-publisher.py select --tag "$TAG" --destinations "$DESTINATIONS" \
            --modrinth-attested "$MODRINTH_ATTESTED" --hangar-attested "$HANGAR_ATTESTED"

      - name: Verify Candidate Run Provenance
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release-publisher.py provenance --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          --sha "$GITHUB_SHA" --run-id "$CANDIDATE_RUN"

      - name: Download Candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.candidate_run_id }}-${{ steps.candidate.outputs.attempt }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download Evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ inputs.candidate_run_id }}-${{ steps.candidate.outputs.attempt }}
          path: evidence
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Verify Candidate and Boot Evidence
        env:
          CANDIDATE_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
        run: >-
          python3 scripts/release-candidate.py check-evidence --directory candidate --evidence evidence/evidence.json
          --tag "$TAG" --sha "$GITHUB_SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT"
          --repository "$GITHUB_REPOSITORY"

      - name: Refuse a Reused or Overlapping Attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED: ${{ inputs.modrinth_absence_confirmed || inputs.hangar_absence_confirmed }}
        run: >-
          python3 scripts/release-publisher.py guard --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --attested "$ATTESTED"

      # Signed out, with the job's read token for GitHub only. A Modrinth or Hangar version
      # that is not publicly complete needs this dispatch's attestation.
      - name: Check Each Destination Without Credentials
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
          SELECT_GITHUB: ${{ steps.select.outputs.github }}
          SELECT_MODRINTH: ${{ steps.select.outputs.modrinth }}
          SELECT_HANGAR: ${{ steps.select.outputs.hangar }}
          MODRINTH_ATTESTED: ${{ inputs.modrinth_absence_confirmed }}
          HANGAR_ATTESTED: ${{ inputs.hangar_absence_confirmed }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
        run: |
          set -euo pipefail
          common=(--directory candidate --evidence evidence/evidence.json --tag "$TAG" --sha "$GITHUB_SHA"
                  --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --repository "$GITHUB_REPOSITORY")
          if [ "$SELECT_GITHUB" = true ]; then
            python3 scripts/release-github.py --preflight "${common[@]}"
          fi
          if [ "$SELECT_MODRINTH" = true ]; then
            python3 scripts/release-distributors.py public modrinth "${common[@]}" --attested "$MODRINTH_ATTESTED"
          fi
          if [ "$SELECT_HANGAR" = true ]; then
            python3 scripts/release-distributors.py public hangar "${common[@]}" --attested "$HANGAR_ATTESTED"
          fi

      - name: Summarise Publication
        env:
          DESTINATIONS: ${{ inputs.destinations }}
          CANDIDATE_ATTEMPT: ${{ steps.candidate.outputs.attempt }}
          SELECT_GITHUB: ${{ steps.select.outputs.github }}
          SELECT_MODRINTH: ${{ steps.select.outputs.modrinth }}
          SELECT_HANGAR: ${{ steps.select.outputs.hangar }}
          MODRINTH_ATTESTED: ${{ inputs.modrinth_absence_confirmed }}
          HANGAR_ATTESTED: ${{ inputs.hangar_absence_confirmed }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
        run: |
          {
            echo "## Publish $TAG"
            echo
            echo "Candidate run $CANDIDATE_RUN, attempt $CANDIDATE_ATTEMPT. Approving the \`release\` environment starts every selected destination job below at once, each publishing exactly these files, unchanged."
            echo
            echo "| Destination | Selected | Absence attested |"
            echo "| :--- | :--- | :--- |"
            echo "| GitHub | $SELECT_GITHUB | not needed |"
            echo "| Modrinth \`${MODRINTH_PROJECT:-not set}\` | $SELECT_MODRINTH | $MODRINTH_ATTESTED |"
            echo "| Hangar \`${HANGAR_PROJECT:-not set}\` | $SELECT_HANGAR | $HANGAR_ATTESTED |"
            echo
            echo '```json'
            cat candidate/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-github:
    name: Publish to GitHub
    needs: plan
    if: github.ref == format('refs/tags/{0}', inputs.tag) && startsWith(inputs.tag, 'v') && needs.plan.outputs.github == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment with a required maintainer reviewer; the job waits here, before any
    # step runs. The only job with write access. actions: read is for the approval check and
    # the candidate's artifacts.
    environment: release
    # N6-REL-05 shared state: this job moves GitHub's Latest marker, so it runs in one group for
    # every tag of the repository, not keyed on the tag. Two tags can then never both decide
    # they own the marker; release-github.py rechecks ownership immediately before the write.
    # GitHub keeps one running and one pending job per group, and a third tag's GitHub job
    # replaces the pending one. A job waiting here for the group has not reached the gate, so
    # it needs its own approval later (RELEASE_PROCESS.md, The Latest marker).
    concurrency:
      group: release-shared-state
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      CANDIDATE_ATTEMPT: ${{ needs.plan.outputs.attempt }}

    steps:
      # Only for scripts/, at the tagged commit the candidate was built from.
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Maintainer Approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-publisher.py approval --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"

      - name: Download Candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download Evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: evidence
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      # Every selected destination, not only GitHub: a credential or project prerequisite that
      # can be checked without writing stops all of them before the first public write. The
      # other destinations' versions are not looked up: a sibling job may already have written.
      - name: Preflight Every Selected Destination
        env:
          GH_TOKEN: ${{ github.token }}
          SELECT_GITHUB: ${{ needs.plan.outputs.github }}
          SELECT_MODRINTH: ${{ needs.plan.outputs.modrinth }}
          SELECT_HANGAR: ${{ needs.plan.outputs.hangar }}
          MODRINTH_TOKEN: ${{ needs.plan.outputs.modrinth == 'true' && secrets.MODRINTH_TOKEN || '' }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
          HANGAR_API_TOKEN: ${{ needs.plan.outputs.hangar == 'true' && secrets.HANGAR_API_TOKEN || '' }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
        run: >-
          python3 scripts/release-publisher.py preflight --own github --github "$SELECT_GITHUB" --modrinth "$SELECT_MODRINTH"
          --hangar "$SELECT_HANGAR" --directory candidate --evidence evidence/evidence.json --tag "$TAG"
          --sha "$GITHUB_SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --repository "$GITHUB_REPOSITORY"

      # Re-verifies the manifest, every digest and the boot evidence, that this run's commit is
      # the candidate's source and that the tag on GitHub still points at it, then creates or
      # resumes the release. GitHub can be checked directly, so it needs no attestation.
      - name: Verify and Promote Candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/release-github.py --directory candidate --evidence evidence/evidence.json
          --tag "$TAG" --sha "$GITHUB_SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT"
          --repository "$GITHUB_REPOSITORY"

  publish-modrinth:
    name: Publish to Modrinth
    needs: plan
    if: github.ref == format('refs/tags/{0}', inputs.tag) && startsWith(inputs.tag, 'v') && needs.plan.outputs.modrinth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    # MODRINTH_TOKEN and HANGAR_API_TOKEN are secrets of the release environment alone.
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_ATTEMPT: ${{ needs.plan.outputs.attempt }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Maintainer Approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-publisher.py approval --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"

      - name: Download Candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download Evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: evidence
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Preflight Every Selected Destination
        env:
          GH_TOKEN: ${{ github.token }}
          SELECT_GITHUB: ${{ needs.plan.outputs.github }}
          SELECT_MODRINTH: ${{ needs.plan.outputs.modrinth }}
          SELECT_HANGAR: ${{ needs.plan.outputs.hangar }}
          MODRINTH_TOKEN: ${{ needs.plan.outputs.modrinth == 'true' && secrets.MODRINTH_TOKEN || '' }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
          HANGAR_API_TOKEN: ${{ needs.plan.outputs.hangar == 'true' && secrets.HANGAR_API_TOKEN || '' }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
        run: >-
          python3 scripts/release-publisher.py preflight --own modrinth --github "$SELECT_GITHUB" --modrinth "$SELECT_MODRINTH"
          --hangar "$SELECT_HANGAR" --directory candidate --evidence evidence/evidence.json --tag "$TAG"
          --sha "$GITHUB_SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --repository "$GITHUB_REPOSITORY"

      # Re-verifies the candidate, its evidence and the tag, then looks the version up with the
      # token. Only when it is absent, and immediately before the upload, the script requires
      # this dispatch's attestation, attempt 1 of this run and no overlapping publisher run
      # (re-running this job alone reuses plan's outputs, so plan's check is not enough).
      - name: Publish to Modrinth If Absent
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
          ATTESTED: ${{ inputs.modrinth_absence_confirmed }}
        run: >-
          python3 scripts/release-distributors.py publish modrinth --directory candidate
          --evidence evidence/evidence.json --tag "$TAG" --sha "$GITHUB_SHA" --run-id "$CANDIDATE_RUN"
          --attempt "$CANDIDATE_ATTEMPT" --repository "$GITHUB_REPOSITORY" --attested "$ATTESTED"
          --publisher-run-id "$GITHUB_RUN_ID" --publisher-attempt "$GITHUB_RUN_ATTEMPT"

      # A first release goes to a project the registry has not approved yet, so a version can
      # match the candidate while consumers cannot see it. Re-run this job once they can.
      - name: Require a Signed-out Download
        env:
          STATE: ${{ steps.publish.outputs.state }}
        run: |
          if [ "$STATE" != complete ]; then
            echo "::error::Modrinth is $STATE: the version matches the candidate but is not public yet. Re-run this failed job once Modrinth has approved it."
            exit 1
          fi

  publish-hangar:
    name: Publish to Hangar
    needs: plan
    if: github.ref == format('refs/tags/{0}', inputs.tag) && startsWith(inputs.tag, 'v') && needs.plan.outputs.hangar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_ATTEMPT: ${{ needs.plan.outputs.attempt }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Maintainer Approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-publisher.py approval --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"

      - name: Download Candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-candidate-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Download Evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-evidence-${{ inputs.candidate_run_id }}-${{ needs.plan.outputs.attempt }}
          path: evidence
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Preflight Every Selected Destination
        env:
          GH_TOKEN: ${{ github.token }}
          SELECT_GITHUB: ${{ needs.plan.outputs.github }}
          SELECT_MODRINTH: ${{ needs.plan.outputs.modrinth }}
          SELECT_HANGAR: ${{ needs.plan.outputs.hangar }}
          MODRINTH_TOKEN: ${{ needs.plan.outputs.modrinth == 'true' && secrets.MODRINTH_TOKEN || '' }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
          HANGAR_API_TOKEN: ${{ needs.plan.outputs.hangar == 'true' && secrets.HANGAR_API_TOKEN || '' }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
        run: >-
          python3 scripts/release-publisher.py preflight --own hangar --github "$SELECT_GITHUB" --modrinth "$SELECT_MODRINTH"
          --hangar "$SELECT_HANGAR" --directory candidate --evidence evidence/evidence.json --tag "$TAG"
          --sha "$GITHUB_SHA" --run-id "$CANDIDATE_RUN" --attempt "$CANDIDATE_ATTEMPT" --repository "$GITHUB_REPOSITORY"

      # As for Modrinth: the attestation, attempt and overlap checks run inside the script,
      # immediately before the upload, and only when the token's lookup finds no version.
      - name: Publish to Hangar If Absent
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          HANGAR_PROJECT: ${{ vars.HANGAR_PROJECT }}
          ATTESTED: ${{ inputs.hangar_absence_confirmed }}
        run: >-
          python3 scripts/release-distributors.py publish hangar --directory candidate
          --evidence evidence/evidence.json --tag "$TAG" --sha "$GITHUB_SHA" --run-id "$CANDIDATE_RUN"
          --attempt "$CANDIDATE_ATTEMPT" --repository "$GITHUB_REPOSITORY" --attested "$ATTESTED"
          --publisher-run-id "$GITHUB_RUN_ID" --publisher-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Require a Signed-out Download
        env:
          STATE: ${{ steps.publish.outputs.state }}
        run: |
          if [ "$STATE" != complete ]; then
            echo "::error::Hangar is $STATE: the version matches the candidate but is not public yet. Re-run this failed job once Hangar has approved it."
            exit 1
          fi

  # N6-REL-06. Neither job holds a secret or writes anything, and neither joins a shared
  # concurrency group: the paste is the write, and the confirm job checks the owner again
  # after approval, so the order approvals arrive in does not matter. The checkout fetches
  # every tag, because a newer tag may own the page by the time the paste is confirmed.
  check-modrinth-description:
    name: Check the Public Modrinth Description
    needs: [plan, publish-modrinth]
    if: github.ref == format('refs/tags/{0}', inputs.tag) && startsWith(inputs.tag, 'v') && needs.plan.outputs.modrinth == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read is for reading the confirm environment's protection settings.
    permissions:
      actions: read
      contents: read
    outputs:
      paste_needed: ${{ steps.description.outputs.paste_needed }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare the Public Body and Request a Paste If Needed
        id: description
        env:
          GH_TOKEN: ${{ github.token }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
        run: >-
          python3 scripts/release-description.py check --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          --project "$MODRINTH_PROJECT" --output "$GITHUB_OUTPUT"

  confirm-modrinth-description:
    name: Confirm the Pasted Modrinth Description
    needs: check-modrinth-description
    if: github.ref == format('refs/tags/{0}', inputs.tag) && startsWith(inputs.tag, 'v') && needs.check-modrinth-description.outputs.paste_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Its own protected environment, maintainer as required reviewer and no secrets
    # (N6-REL-07): approving it says the file named in the check job's summary was pasted.
    environment: modrinth-description
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck the Owner and Read Back the Pasted Description
        env:
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT }}
        run: >-
          python3 scripts/release-description.py confirm --repository "$GITHUB_REPOSITORY" --tag "$TAG"
          --project "$MODRINTH_PROJECT"
