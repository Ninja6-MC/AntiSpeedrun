name: Bug Report
description: Report a bug or unintended behavior in AntiSpeedrun
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please ensure you are running the latest version of AntiSpeedrun before submitting.

  - type: input
    id: version
    attributes:
      label: AntiSpeedrun Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server Software & Version
      placeholder: "e.g. Paper 1.21.4 build 120 / Folia 1.21.4"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Player attempts to enter Nether portal without iron advancement
        2. Portal is not cancelled
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Server Logs / Stack Trace
      description: Paste any relevant console output or stack traces.
      render: text
    validations:
      required: false
