name: AntiSpeedrunProbe
version: '1'
main: com.ninja6.antispeedrun.probe.ProbePlugin
api-version: '1.21'
folia-supported: true
# Loaded after AntiSpeedrun, whose expectTeleport the teleport query calls.
softdepend: [AntiSpeedrun]
description: Test-only observer for the real-server integration harness. Never install it on a live server.
commands:
  asrprobe:
    description: The integration harness's console queries. Refused from anywhere but the console.
    usage: /asrprobe <health|where|teleport|near|remove|credits|container|loot|nodrops|npc|advancement|structure|enter> ...
