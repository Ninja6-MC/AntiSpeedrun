# Schema version of this file, kept current by the plugin. Do not edit or remove it:
# on start an older file is migrated forward (the old one is saved to backups/ first)
# and a file from a newer version is refused.
config-version: 1

# AntiSpeedrun - SMP_STANDARD preset
#
# Applied by: /asr profile apply SMP_STANDARD
# Applying a preset OVERWRITES config.yml wholesale. The previous file is copied to
# plugins/AntiSpeedrun/backups/config-<timestamp>.yml first, so a preset applied by
# mistake is recoverable.
#
# The default. Every gate on, everything advancement-driven, no time or tenure
# requirements anywhere -- progress is earned by playing, never by waiting. This preset
# is identical to the shipped config.yml; PresetProfileTest asserts that, so the two
# cannot drift apart.
#
# Configuration Profiles: CASUAL, SMP_STANDARD, HARDCORE, or CUSTOM. Hand-editing away
# from a preset means setting profile: CUSTOM yourself -- nothing rewrites this key.
profile: SMP_STANDARD

# 1. Dimension Progression Gates
dimension-gates:
  nether:
    enabled: true
    require-playtime-hours: 0          # Default 0 (Advancement-driven). Set >0 for time gating.
    require-advancements:
      - "minecraft:story/smelt_iron"
    rejection-message: "<red>🔒 The Nether is locked! Requires <yellow>Iron Gear<red> (Smelt an iron ingot). Type <gold>/progress"

  the_end:
    enabled: true
    require-playtime-hours: 0          # Default 0 (Advancement-driven). Set >0 for time gating.
    require-account-age-days: 0        # Default 0 (Advancement-driven). Set >0 for age gating.
    require-advancements:
      - "minecraft:story/mine_diamond"
      - "minecraft:nether/obtain_blaze_rod"
      - "minecraft:nether/find_fortress"
    rejection-message: "<red>🔒 The End is sealed! Complete survival progression first. Type <gold>/progress"

# 2. Anti-Boosting & Item Progression Gating (Minecraft Tag & Pattern Resolution)
item-progression:
  enabled: true
  # Gating is a pure function of (player advancements, material). Naturally generated loot
  # is not special-cased: see docs/provenance-model.md for why the exemption was removed
  # rather than fixed. gate-natural-structure-chests, gate-player-placed-chests and
  # gate-armor-stands are gone because each configured a distinction that no longer exists.
  drop-recall-enabled: true           # A player can always re-collect an item entity they dropped or died with
  gate-dispensers: true               # Prevent dispensers from equipping locked armor onto unqualified players
  gate-nested-bundles: true           # Prevent extracting/spraying locked items from Bundles
  feedback-cooldown-seconds: 3        # Cooldown between action bar warning messages
  rejection-message: "<red>🔒 You cannot pick up <yellow>{ITEM}<red>! Requires: <gold>{REQUIREMENT}"
  # Vanilla completes story/mine_stone, story/smelt_iron, story/iron_tools, story/upgrade_tools,
  # story/mine_diamond and nether/obtain_blaze_rod as soon as the player HOLDS the item, so a
  # gift or a chest withdrawal opens the gate. While this is on, those six are answered from
  # what the player did themselves instead: mined, smelted, crafted or killed. It applies to
  # every gate that requires one of them, the dimension gates included, even while enabled
  # above is false. /advancement grant and revoke no longer change them. Nothing carries over
  # from vanilla advancements already earned. See docs/provenance-model.md.
  require-personal-credit: true
  # Loot the player generates themselves (a structure chest they open first, a trial vault) may
  # stand in for mining iron or diamonds, never for smelting or crafting. Takes effect on reload.
  count-structure-loot: true
  gated-items:
    iron-tier:
      # Match modes: PREFIX ("IRON_*"), SUFFIX ("*_IRON_ORE"), CONTAINS ("*_IRON_*").
      # Prefix-only matching leaks the deepslate ore variants - DEEPSLATE_IRON_ORE does
      # not start with IRON_, so silk-touched ore below Y=0 would be ungated.
      match-patterns:
        - "IRON_*"
        - "RAW_IRON*"
        - "CHAINMAIL_*"
        - "*_IRON_ORE"
      exclude-materials:
        - "IRON_DOOR"
        - "IRON_TRAPDOOR"
        - "IRON_BARS"
        - "HEAVY_WEIGHTED_PRESSURE_PLATE"
        - "CHAIN"
        - "LANTERN"
        - "SOUL_LANTERN"
      items:
        - "SHIELD"
        - "BUCKET"
        - "SHEARS"
        - "FLINT_AND_STEEL"
        - "CROSSBOW"
        - "TRIAL_KEY"
        - "OMINOUS_TRIAL_KEY"
        - "OMINOUS_BOTTLE"
      require-advancements:
        - "minecraft:story/mine_stone"
      require-playtime-hours: 0
      hint: "Mine Stone with a wooden pickaxe (Stone Age)"

    diamond-tier:
      match-patterns:
        - "DIAMOND_*"
        - "*_DIAMOND_ORE"
      items:
        # DIAMOND_* does not match DIAMOND itself - there is no trailing underscore - so the
        # gem escaped every pattern while the tools made from it were gated. Same class of
        # leak as the deepslate ores above.
        - "DIAMOND"
      require-advancements:
        - "minecraft:story/iron_tools"
      require-playtime-hours: 0
      hint: "Craft an Iron Pickaxe"

    nether-tier:
      items:
        - "BLAZE_ROD"
        - "BLAZE_POWDER"
        - "NETHER_WART"
        - "BREWING_STAND"
        - "GHAST_TEAR"
        - "MAGMA_CREAM"
        - "WITHER_SKELETON_SKULL"
        - "BREEZE_ROD"
        - "WIND_CHARGE"
      require-advancements:
        - "minecraft:story/enter_the_nether"
      require-playtime-hours: 0
      hint: "Enter the Nether"

    end-tier:
      items:
        - "ENDER_EYE"
        - "END_CRYSTAL"
        - "SHULKER_SHELL"
        - "SHULKER_BOX"
        - "ELYTRA"
        - "DRAGON_BREATH"
        - "DRAGON_HEAD"
        - "DRAGON_EGG"
        - "TOTEM_OF_UNDYING"
      require-advancements:
        - "minecraft:nether/obtain_blaze_rod"
        - "minecraft:nether/find_fortress"
      require-playtime-hours: 0          # Was 20.0 - contradicted the advancement-driven End gate above.
      require-account-age-days: 0        # Was 7 - see the getFirstPlayed caveat in section 2.1.
      hint: "Unlock The End Gate"

    netherite-tier:
      # Precedence: a Material matching two tiers resolves MOST-RESTRICTIVE-WINS - the tier
      # whose requirements are a strict superset owns it, identical requirements fall back to
      # document order, and an incomparable pair fails startup with a named error rather than
      # letting map ordering decide. An exclude-materials entry is applied last and wins
      # outright, which is how a material claimed by two systems is handed to the right one.
      match-patterns:
        - "NETHERITE_*"
      exclude-materials:
        # Matches NETHERITE_* but is a smithing template, owned by trim-progression in
        # section 3, not by this tier. Excluding it here is the resolution, not a collision.
        - "NETHERITE_UPGRADE_SMITHING_TEMPLATE"
      items:
        - "ANCIENT_DEBRIS"
        - "MACE"
        - "HEAVY_CORE"
      require-advancements:
        - "minecraft:story/mine_diamond"
        - "minecraft:nether/obtain_blaze_rod"
      hint: "Mine Diamonds & Explore the Nether"

# 3. Armor Trim & Smithing Template Progression
trim-progression:
  enabled: true
  gate-natural-trim-chests: false             # Default FALSE: structure loot keeps its templates. TRUE removes a gated template from natural loot for a player who has not explored its structure.
  block-unearned-template-duplication: true   # Require structure discovery to clone templates in crafting tables and Crafters
  block-unearned-smithing: true               # Require structure discovery to apply trim in Smithing Table
  block-wearing-unearned-trims: true          # Prevent wearing armor with unearned trims

# 4. Idle Reminder Engine (Per-Player EntityScheduler)
idle-reminder:
  enabled: true
  stand-still-seconds: 15              # Trigger when standing still for 15s
  cooldown-minutes: 10                 # Minimum 10 min between reminders
  display-duration-seconds: 5          # Display on screen for 5 seconds
  display-type: "ACTIONBAR"            # Options: ACTIONBAR, TITLE, CHAT
  message: "<yellow>💡 Next Goal: <white>{NEXT_STEP} <gray>(Run <gold>/progress<gray>)"

# 5. Journey Guide Book
journey-book:
  give-on-first-join: true
  title: "<gold>Ninja6 Survival Guide"
  author: "Ninja6-MC"

# 6. Multi-Dragon Boss Combat Scaling
boss-scaling:
  enabled: false                       # Development build: enable after Epic 6 is complete.
  scale-resummoned-dragons: true       # Scale 4-End-Crystal respawn rituals
  battle-prep-seconds: 30              # Party reinforcement window upon End entry / resummon
  multi-dragon:
    enabled: true
    multiplier: 0.5                    # Scaling factor (must be > 0.0)
    rounding-mode: "HALF_UP"           # Options: HALF_UP, CEIL, FLOOR
    max-dragons: 5
    balanced-xp: true                  # 1st dragon full XP, secondary dragons 1,000 XP
  exit-portal-egg:
    enabled: true
    placement-mode: "TOP_PILLAR"       # Options: TOP_PILLAR, ITEM_DROP, NONE
  skull-drop-chance: 0.05
  # Resummon battles only. During a world's FIRST fight the exit portal does not exist
  # yet - vanilla generates it when the dragon dies - so this is a no-op on initial entry.
  exit-portal-lock-during-battle: true
  # Escape valve: releases the lock when no player has damaged a dragon for this long,
  # so anyone who logs in mid-fight is not trapped in the End. 0 disables the release.
  exit-portal-lock-release-minutes: 10

# 7. Anti-Cheese Engine
anti-cheese:
  enabled: true
  block-bed-anchor-boss-damage: false  # Off until the v0.2.0/v0.3.0 playtest. Cancels DamageType.BAD_RESPAWN_POINT against bosses
  # Off by default; set true to enforce max-single-hit-boss-damage.
  cap-single-hit-boss-damage: false
  # Time-to-kill budget, not just an anti-1-shot guard. The Ender Dragon has 200 HP and
  # the Wither 300, so 50.0 still permits a 4-hit dragon kill. 12.0 gives roughly a
  # 17-hit fight. Raise it for a faster fight; lower it to force sustained combat.
  max-single-hit-boss-damage: 12.0
  block-early-eye-throwing: true
  # MiniMessage. A legacy § code is refused at load; the default is used.
  early-eye-rejection-message: "<red>🔒 Your Eye of Ender will not fly yet! Find a <yellow>Nether Fortress<red> first. Type <gold>/progress"
  block-exit-portal-crystal-place: false
  block-gateway-pre-dragon: false      # Off until the v0.2.0/v0.3.0 playtest. Block bridging, pearling & chorus fruit to the Outer End
  outer-end-radius: 500                # Boundary enforced until the world's first dragon dies
  outer-end-poll-seconds: 2            # EntityScheduler bounds poll; also catches Wind Charge jumps

# 8. Villager Progression
villager-progression:
  gate-mending-trade: false
  required-advancement: "minecraft:story/cure_zombie_villager"
  hint: "Cure a Zombie Villager (Zombie Doctor)"
